<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>AI 分析 - 招投标信息展示系统</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/font-awesome.min.css') }}">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --primary-color: #667eea;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-md: 0 3px 6px -1px rgba(0, 0, 0, .08);
            --shadow-lg: 0 10px 20px -6px rgba(0, 0, 0, .12);
            --radius-lg: 16px;
            --radius-md: 12px;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            color: var(--text-primary);
        }
        .header-container {
            background: linear-gradient(135deg, rgba(102,126,234,.95) 0%, rgba(118,75,162,.95) 100%);
            color: #fff;
            padding: 1.25rem 0;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-lg);
        }
        .header-container h1 { font-size: 1.35rem; font-weight: 700; margin: 0; }
        .back-btn {
            color: #fff; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
            padding: 6px 14px; background: rgba(255,255,255,.18); border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,.3); transition: all .25s;
        }
        .back-btn:hover { background: rgba(255,255,255,.3); color: #fff; }
        .panel {
            background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
            padding: 1.1rem 1.25rem; margin-bottom: 1.25rem;
        }
        .stat-card {
            background: #fff; border-radius: var(--radius-md); padding: 1rem 1.1rem;
            box-shadow: var(--shadow-md); height: 100%; position: relative; overflow: hidden;
        }
        .stat-card::before {
            content: ''; position: absolute; left: 0; top: 0; width: 4px; height: 100%;
            background: var(--primary-gradient);
        }
        .stat-title { font-size: .85rem; color: var(--text-secondary); margin-bottom: .35rem; }
        .stat-main { font-size: 1.5rem; font-weight: 700; }
        .stat-sub { font-size: .78rem; color: var(--text-secondary); margin-top: .3rem; }
        .job-card {
            background: #fff; border-radius: var(--radius-md); box-shadow: var(--shadow-md);
            padding: 1rem 1.1rem; margin-bottom: .9rem; border-left: 4px solid var(--primary-color);
            transition: transform .2s, box-shadow .2s;
        }
        .job-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .job-title { font-weight: 600; font-size: .98rem; line-height: 1.45; }
        .badge-soft {
            display: inline-block; padding: 2px 9px; border-radius: 999px;
            font-size: .74rem; font-weight: 600; margin-right: 6px; margin-top: 4px;
        }
        .b-type { background: #eef2ff; color: #4338ca; }
        .b-ptype { background: #ecfdf5; color: #047857; }
        .b-rel-hi { background: #fee2e2; color: #b91c1c; }
        .b-rel-mid { background: #fef3c7; color: #b45309; }
        .b-rel-lo { background: #f1f5f9; color: #475569; }
        .b-cat { background: #e0f2fe; color: #0369a1; }
        .b-pending { background: #f1f5f9; color: #64748b; }
        .summary-text { color: #334155; font-size: .88rem; line-height: 1.65; margin: .5rem 0; }
        .kw { display:inline-block; background:#f8fafc; border:1px solid var(--border-color);
              color:#475569; border-radius:6px; padding:1px 7px; font-size:.74rem; margin:2px 4px 2px 0; }
        .meta-line { font-size: .78rem; color: var(--text-secondary); }
        .empty-state { text-align: center; color: var(--text-secondary); padding: 3rem 1rem; }
        #taskBar { display: none; }
        .progress { height: 8px; border-radius: 999px; }
        pre.content-pre {
            white-space: pre-wrap; word-break: break-all; background:#f8fafc;
            border:1px solid var(--border-color); border-radius:8px; padding:12px;
            max-height: 45vh; overflow:auto; font-size: .82rem; line-height: 1.6;
        }
        .form-label-sm { font-size: .8rem; color: var(--text-secondary); margin-bottom: .2rem; }
        .qual-box {
            background:#f8fafc; border:1px solid var(--border-color); border-left:3px solid #38bdf8;
            border-radius:8px; padding:8px 12px; font-size:.85rem; line-height:1.7; color:#334155;
            white-space: pre-wrap; word-break: break-all;
        }
        .ai-table { font-size: .84rem; table-layout: fixed; width: 100%; }
        .ai-table thead th {
            background:#f8fafc; color:#475569; font-weight:600; font-size:.78rem;
            white-space:nowrap; border-bottom:2px solid var(--border-color); padding:.6rem .75rem;
        }
        .ai-table td { padding:.6rem .75rem; vertical-align:top; }
        /* 固定列宽，剩余空间只给「项目名称 / 资格要求」，避免数值列之间被撑出大空隙 */
        .ai-table .c-idx { width:52px; }
        .ai-table .c-date { width:96px; white-space:nowrap; }
        .ai-table .c-region { width:104px; white-space:nowrap; }
        .ai-table .c-method { width:104px; white-space:nowrap; }
        .ai-table .c-budget { width:110px; white-space:nowrap; }
        .ai-table .c-deadline { width:132px; white-space:nowrap; }
        .ai-table .c-purchaser { width:200px; }
        .ai-table .c-op { width:84px; white-space:nowrap; }
        .ai-table .c-name, .ai-table .c-qual { width: auto; }
        .ai-table tbody tr { cursor:pointer; }
        .ai-table tbody tr:hover { background:#f8fafc; }
        .row-title { color:#1e293b; font-weight:600; text-decoration:none; line-height:1.45; }
        .row-title:hover { color:var(--primary-color); }
        .cell-clip {
            display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
            overflow:hidden; color:#475569; line-height:1.55;
        }
        .qm-table { font-size:.84rem; }
        .qm-table td, .qm-table th { padding:.35rem .5rem; vertical-align:top; }
        .st-ok { color:#15803d; font-weight:600; }
        .st-no { color:#b91c1c; font-weight:600; }
        .st-mid { color:#b45309; font-weight:600; }
    </style>
</head>
<body>
<div class="header-container">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div class="d-flex align-items-center gap-3">
            <a href="{{ url_for('main.index') }}" class="back-btn"><i class="fas fa-arrow-left"></i> 返回首页</a>
            <h1><i class="fas fa-robot me-2"></i>AI 分析与详情正文</h1>
        </div>
        <div class="small" id="modelLabel">模型加载中…</div>
    </div>
</div>

<div class="container pb-5">
    <!-- G3：模型主机停机提示（默认隐藏） -->
    <div id="modelAlert" class="alert alert-warning mt-3 mb-0" style="display:none;" role="alert">
        <i class="fas fa-exclamation-triangle me-2"></i>
        <span id="modelAlertText"></span>
    </div>

    <!-- 统计 -->
    <div class="row g-3 mb-2" id="statsRow"></div>

    <!-- 操作面板 -->
    <div class="panel mt-3">
        <div class="row g-2 align-items-end">
            <div class="col-6 col-md-2">
                <div class="form-label-sm">数据表</div>
                <select class="form-select form-select-sm" id="fTable">
                    <option value="all">全部（山东+江苏+浙江）</option>
                    <option value="bidding_info">山东</option>
                    <option value="jiangsu_bidding_info">江苏</option>
                    <option value="zhejiang_bidding_info">浙江</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <div class="form-label-sm">分析状态</div>
                <select class="form-select form-select-sm" id="fStatus">
                    <option value="all">全部</option>
                    <option value="ok">已分析</option>
                    <option value="pending">待分析</option>
                    <option value="failed">失败</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <div class="form-label-sm">公告类别</div>
                <select class="form-select form-select-sm" id="fAnn">
                    <option value="">全部</option>
                    <option>中标公告</option>
                    <option>竞争性谈判</option>
                    <option>公开招标</option>
                    <option>询价公告</option>
                    <option>废标公告</option>
                    <option>其他</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <div class="form-label-sm">四大类命中</div>
                <select class="form-select form-select-sm" id="fCat">
                    <option value="">不限</option>
                    <option value="交通">交通</option>
                    <option value="智能化">智能化</option>
                    <option value="信号灯">信号灯</option>
                    <option value="监控">监控</option>
                </select>
            </div>
            <div class="col-6 col-md-1">
                <div class="form-label-sm">相关性≥</div>
                <input type="number" class="form-control form-control-sm" id="fRel" min="0" max="10" value="0">
            </div>
            <div class="col-6 col-md-2">
                <div class="form-label-sm">发布日期（起）</div>
                <input type="date" class="form-control form-control-sm" id="fStart">
            </div>
            <div class="col-6 col-md-2">
                <div class="form-label-sm">发布日期（止）</div>
                <input type="date" class="form-control form-control-sm" id="fEnd">
            </div>
            <div class="col-12 col-md-2">
                <div class="form-label-sm">标题关键词</div>
                <input type="text" class="form-control form-control-sm" id="fKeyword" placeholder="如：信号灯">
            </div>
        </div>

        <hr class="my-3">

        <div class="row g-2 align-items-end">
            <div class="col-6 col-md-2">
                <div class="form-label-sm">每批条数</div>
                <input type="number" class="form-control form-control-sm" id="oLimit" min="1" max="50" value="20">
            </div>
            <div class="col-12 col-md-10 d-flex flex-wrap gap-2">
                <button class="btn btn-sm btn-primary" id="btnAnalyze">
                    <i class="fas fa-magic me-1"></i>开始 AI 分析
                </button>
                <button class="btn btn-sm btn-outline-secondary" id="btnRefresh">
                    <i class="fas fa-sync-alt me-1"></i>刷新列表
                </button>
                <button class="btn btn-sm btn-outline-success" id="btnCompany">
                    <i class="fas fa-id-card me-1"></i>公司资质档案
                </button>
                <span class="small text-muted align-self-center">每批 N 条，跑完自动进下一批直到没候选（本次最多 10 批）；自动抓取当日命中关键词记录的正文后分析，失败记录不重复挑</span>
            </div>
        </div>

        <div id="taskBar" class="mt-3">
            <div class="d-flex justify-content-between align-items-center small mb-1">
                <span id="taskMsg">任务进行中…</span>
                <span class="d-flex align-items-center gap-2">
                    <span id="taskCount"></span>
                    <button id="btnStop" class="btn btn-sm btn-outline-danger py-0 px-2"
                            style="display:none" title="当前这条跑完即停，已完成的记录保留">停止</button>
                </span>
            </div>
            <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated"
                     id="taskProgress" style="width:0%"></div>
            </div>
            <div class="small text-muted mt-1" id="taskCurrent"></div>
        </div>
    </div>

    <!-- 列表 -->
    <div id="listContainer">
        <div class="empty-state"><i class="fas fa-spinner fa-spin"></i> 加载中…</div>
    </div>
    <div class="d-flex justify-content-center mt-4" id="paginationContainer"></div>
</div>

<!-- 详情弹窗 -->
<div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="dmTitle">详情</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="dmAnalysis" class="mb-3"></div>
                <div id="dmDeepBox" class="mb-3"></div>
                <h6 class="fw-bold">详情页正文</h6>
                <pre class="content-pre" id="dmContent">（无正文）</pre>
            </div>
            <div class="modal-footer">
                <a href="#" target="_blank" rel="noopener" class="btn btn-sm btn-outline-secondary" id="dmLink">
                    <i class="fas fa-external-link-alt me-1"></i>打开原始页面
                </a>
                <button class="btn btn-sm btn-success" id="dmDeep">
                    <i class="fas fa-user-check me-1"></i>深入分析（对比公司资质）
                </button>
                <button class="btn btn-sm btn-primary" id="dmReanalyze">
                    <i class="fas fa-magic me-1"></i>重新分析
                </button>
                <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<!-- 公司资质档案 -->
<div class="modal fade" id="companyModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-id-card me-2"></i>我方公司资质档案</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="small text-muted">深入分析会拿这里填写的内容，与招标文件的资格要求、评分规则逐条对比。</p>
                <div id="companyForm"><div class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin"></i> 加载中…</div></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-sm btn-success" id="btnSaveCompany">
                    <i class="fas fa-save me-1"></i>保存
                </button>
                <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
<script>
(function () {
    const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
    const TABLE_LABEL = {bidding_info: '山东', jiangsu_bidding_info: '江苏', zhejiang_bidding_info: '浙江'};
    let currentPage = 1;
    let currentDetail = null;

    const $ = id => document.getElementById(id);

    function headers(json) {
        const h = {'X-CSRFToken': csrfToken};
        if (json) h['Content-Type'] = 'application/json';
        return h;
    }

    async function api(url, opts) {
        const resp = await fetch(url, opts || {});
        let data = null;
        try { data = await resp.json(); } catch (e) { /* ignore */ }
        if (!resp.ok || (data && data.success === false)) {
            throw new Error((data && data.message) || ('HTTP ' + resp.status));
        }
        return data;
    }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    // ---------- 统计 ----------
    async function loadStats() {
        try {
            const res = await api('/ai-analysis/api/stats');
            $('modelLabel').textContent = '本地模型：' + res.model;
            // G3：让停机可见，不再靠 failed=0 掩盖
            const ms = res.model_status || {};
            const alertBox = $('modelAlert');
            if (ms.reachable === false) {
                $('modelAlertText').textContent =
                    '模型主机关机 / 服务不可达，批量分析已暂停，待分析记录保持 pending。'
                    + (ms.message ? '（' + ms.message + '）' : '')
                    + ' 人工上传附件仍可使用。';
                alertBox.className = 'alert alert-warning mt-3 mb-0';
                alertBox.style.display = 'block';
                $('modelLabel').textContent = '本地模型：' + res.model + '（离线）';
            } else if (ms.status === 'failed') {
                $('modelAlertText').textContent = '模型服务响应异常：' + (ms.message || '请检查服务');
                alertBox.className = 'alert alert-danger mt-3 mb-0';
                alertBox.style.display = 'block';
            } else {
                alertBox.style.display = 'none';
            }
            const html = Object.keys(res.data).map(t => {
                const d = res.data[t];
                return `<div class="col-12 col-md-4">
                    <div class="stat-card">
                        <div class="stat-title">${esc(d.label)}数据</div>
                        <div class="stat-main">${d.analyzed} <span class="stat-sub">/ ${d.total} 已分析</span></div>
                        <div class="stat-sub">近30天：有正文 ${d.has_content} · 待分析 ${d.pending} · 失败 ${d.failed}</div>
                    </div>
                </div>`;
            }).join('');
            $('statsRow').innerHTML = html;
            updateTask(res.task);
        } catch (e) {
            $('statsRow').innerHTML = `<div class="col-12 text-danger small">统计加载失败：${esc(e.message)}</div>`;
        }
    }

    // ---------- 任务状态 ----------
    let taskTimer = null;
    function updateTask(task) {
        if (!task) return;
        if (task.running) {
            $('taskBar').style.display = 'block';
            $('taskMsg').textContent = task.message || '任务进行中…';
            const pct = task.total ? Math.round(task.done / task.total * 100) : 0;
            $('taskProgress').style.width = pct + '%';
            $('taskCount').textContent = `${task.done || 0} / ${task.total || 0}`;
            $('taskCurrent').textContent = task.current ? ('正在处理：' + task.current) : '';
            // 停止是软停止：点了之后状态变 stopping，按钮禁用等当前这条跑完
            const stopping = task.status === 'stopping';
            $('btnStop').style.display = '';
            $('btnStop').disabled = stopping;
            $('btnStop').textContent = stopping ? '停止中…' : '停止';
            if (!taskTimer) taskTimer = setInterval(pollTask, 2500);
        } else {
            $('btnStop').style.display = 'none';
            $('btnStop').disabled = false;
            $('btnStop').textContent = '停止';
            if (task.finished_at && task.message) {
                $('taskBar').style.display = 'block';
                $('taskMsg').textContent = task.message;
                $('taskProgress').style.width = '100%';
                $('taskCount').textContent = `${task.total || 0} / ${task.total || 0}`;
                $('taskCurrent').textContent = task.finished_at;
            }
            if (taskTimer) { clearInterval(taskTimer); taskTimer = null; }
        }
    }

    async function pollTask() {
        try {
            const res = await api('/ai-analysis/api/task');
            updateTask(res.task);
            if (!res.task.running) {
                loadStats();
                loadList(currentPage);
            }
        } catch (e) { /* ignore */ }
    }

    // ---------- 列表 ----------
    function relBadge(rel) {
        if (rel == null) return '';
        const cls = rel >= 7 ? 'b-rel-hi' : (rel >= 4 ? 'b-rel-mid' : 'b-rel-lo');
        return `<span class="badge-soft ${cls}">相关性 ${rel}/10</span>`;
    }

    function cell(v) {
        return (v && v !== '未获取') ? esc(v) : '<span class="text-muted">未获取</span>';
    }

    function renderItem(d, idx) {
        const statusBadge = d.status === 'ok'
            ? '<span class="badge-soft b-ptype">已分析</span>'
            : (d.status === 'failed'
                ? '<span class="badge-soft b-rel-hi">分析失败</span>'
                : '<span class="badge-soft b-pending">待分析</span>');
        const hit = (d.matched_keywords || []).length
            ? `<span class="badge-soft b-rel-hi" title="${esc((d.matched_keywords || []).join('、'))}"><i class="fas fa-bullseye me-1"></i>命中 ${d.matched_keywords.length}</span>`
            : '';
        const fit = d.fit_score
            ? `<span class="badge-soft ${d.fit_score >= 7 ? 'b-rel-hi' : (d.fit_score >= 4 ? 'b-rel-mid' : 'b-rel-lo')}">匹配 ${d.fit_score}/10</span>`
            : (d.has_deep ? '' : '');
        const qual = d.qualification && d.qualification !== '未获取'
            ? `<div class="cell-clip" title="${esc(d.qualification)}">${esc(d.qualification)}</div>`
            : '<span class="text-muted">未获取</span>';
        return `<tr data-table="${d.table}" data-id="${d.id}">
            <td class="text-muted c-idx">${idx}</td>
            <td class="c-name">
                <a href="#" class="row-title">${esc(d.project_name)}</a>
                <div class="mt-1">${statusBadge}${hit}${fit}
                    ${d.announcement_type ? `<span class="badge-soft b-type">${esc(d.announcement_type)}</span>` : ''}
                    ${relBadge(d.relevance)}
                </div>
            </td>
            <td class="c-date">${esc(d.publish_date)}</td>
            <td class="c-region">${esc(d.region)}<div class="small text-muted">${esc(d.project_source)}</div></td>
            <td class="c-method">${cell(d.method)}</td>
            <td class="c-budget">${cell(d.budget)}</td>
            <td class="c-deadline">${cell(d.deadline)}</td>
            <td class="c-purchaser">${cell(d.purchaser)}</td>
            <td class="c-qual">${qual}</td>
            <td class="c-op"><button class="btn btn-sm btn-outline-primary btn-detail"><i class="fas fa-eye me-1"></i>详情</button></td>
        </tr>`;
    }

    async function loadList(page) {
        currentPage = page || 1;
        const p = new URLSearchParams({
            table: $('fTable').value,
            status: $('fStatus').value,
            announcement_type: $('fAnn').value,
            category: $('fCat').value,
            min_relevance: $('fRel').value || 0,
            start_date: $('fStart').value || '',
            end_date: $('fEnd').value || '',
            keyword: $('fKeyword').value || '',
            page: currentPage,
            page_size: 20
        });
        $('listContainer').innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i> 加载中…</div>';
        try {
            const res = await api('/ai-analysis/api/list?' + p.toString());
            if (!res.data.length) {
                $('listContainer').innerHTML = '<div class="panel empty-state"><i class="fas fa-inbox fa-2x mb-3 d-block"></i>没有符合条件的记录</div>';
                $('paginationContainer').innerHTML = '';
                return;
            }
            const base = (res.pagination.page - 1) * res.pagination.page_size;
            const head = `<thead><tr>
                <th class="c-idx">序号</th><th class="c-name">项目名称</th><th class="c-date">发布日期</th>
                <th class="c-region">项目来源</th><th class="c-method">采购方式</th><th class="c-budget">预算金额</th>
                <th class="c-deadline">投标截止</th><th class="c-purchaser">招标人</th>
                <th class="c-qual">资格要求</th><th class="c-op">操作</th></tr></thead>`;
            const body = res.data.map((d, i) => renderItem(d, base + i + 1)).join('');
            $('listContainer').innerHTML =
                `<div class="panel p-0"><div class="table-responsive">
                    <table class="table ai-table align-middle mb-0" style="min-width:1380px">${head}<tbody>${body}</tbody></table>
                </div></div>`;
            renderPagination(res.pagination);
        } catch (e) {
            $('listContainer').innerHTML = `<div class="panel text-danger">加载失败：${esc(e.message)}</div>`;
        }
    }

    function renderPagination(pg) {
        if (!pg || pg.total_pages <= 1) { $('paginationContainer').innerHTML = ''; return; }
        let html = '<ul class="pagination pagination-sm mb-0">';
        html += `<li class="page-item ${pg.page <= 1 ? 'disabled' : ''}"><a class="page-link" href="#" data-page="${pg.page - 1}">上一页</a></li>`;
        const start = Math.max(1, pg.page - 3);
        const end = Math.min(pg.total_pages, start + 6);
        for (let i = start; i <= end; i++) {
            html += `<li class="page-item ${i === pg.page ? 'active' : ''}"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`;
        }
        html += `<li class="page-item ${pg.page >= pg.total_pages ? 'disabled' : ''}"><a class="page-link" href="#" data-page="${pg.page + 1}">下一页</a></li>`;
        html += `<li class="page-item disabled"><span class="page-link">共 ${pg.total} 条</span></li></ul>`;
        $('paginationContainer').innerHTML = html;
    }

    // ---------- 详情 ----------
    function renderDeep(deep) {
        if (!deep) return '';
        const statusCls = s => (s === '满足' ? 'st-ok' : (s === '不满足' ? 'st-no' : 'st-mid'));
        const rows = (deep.qualification_match || []).map(x => `<tr>
            <td>${esc(x.requirement)}</td>
            <td class="text-nowrap ${statusCls(x.status)}">${esc(x.status)}</td>
            <td class="text-muted">${esc(x.note || '-')}</td></tr>`).join('');
        const list = arr => (arr && arr.length)
            ? `<ul class="mb-1 ps-3">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
        return `<div class="p-2" style="border:1px solid var(--border-color);border-radius:10px">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="fw-bold mb-0"><i class="fas fa-user-check text-success me-1"></i>深入分析：资格/评分 vs 我方资质</h6>
                <span class="badge-soft ${deep.fit_score >= 7 ? 'b-rel-hi' : (deep.fit_score >= 4 ? 'b-rel-mid' : 'b-rel-lo')}">匹配度 ${deep.fit_score}/10</span>
            </div>
            ${rows ? `<table class="table table-sm qm-table mb-2"><thead><tr>
                <th style="width:45%">资格要求</th><th style="width:12%">结论</th><th>依据 / 待补材料</th>
            </tr></thead><tbody>${rows}</tbody></table>` : ''}
            ${(deep.scoring_analysis && deep.scoring_analysis.length) ? `<div class="small fw-bold mt-2">评分解读</div>${list(deep.scoring_analysis)}` : ''}
            ${(deep.bid_advice && deep.bid_advice.length) ? `<div class="small fw-bold mt-2">投标建议</div>${list(deep.bid_advice)}` : ''}
            ${(deep.gaps && deep.gaps.length) ? `<div class="small fw-bold mt-2 text-danger">差距 / 风险</div>${list(deep.gaps)}` : ''}
            ${deep.summary ? `<div class="summary-text mt-2">${esc(deep.summary)}</div>` : ''}
        </div>`;
    }

    async function openDetail(table, id, triggerBtn) {
        try {
            const res = await api(`/ai-analysis/api/detail/${table}/${id}`);
            const d = res.data, a = d.analysis || {};
            currentDetail = {table: table, id: id};

            $('dmTitle').textContent = d.project_name;
            const cats = a.categories || {};
            const catBadges = Object.keys(cats).filter(k => cats[k])
                .map(k => `<span class="badge-soft b-cat">${esc(k)}</span>`).join('');
            const kws = (a.keywords || []).map(k => `<span class="kw">${esc(k)}</span>`).join('');
            function listHtml(items, color, label, icon) {
                if (!items || !items.length) return '';
                return `<div class="mb-2"><span class="${color} me-1"><i class="fas ${icon}"></i>${label}</span>${items.map(x => `<span class="kw" style="${borderFor(color)}">${esc(x)}</span>`).join('')}</div>`;
            }
            function borderFor(color) {
                const map = {
                    'text-danger': 'border-color:#fecaca;color:#b91c1c',
                    'text-warning': 'border-color:#fde68a;color:#92400e',
                    'text-primary': 'border-color:#c7d2fe;color:#3730a3',
                };
                return map[color] || '';
            }
            function val(v) {
                return (v && v !== '未获取') ? esc(v) : '<span class="text-muted">未获取</span>';
            }
            const src = d.source || {};
            $('dmAnalysis').innerHTML = `
                <div class="mb-2">
                    <span class="badge-soft b-type">${esc(a.announcement_type || '未分类')}</span>
                    <span class="badge-soft b-ptype">${esc(a.project_type || '-')}</span>
                    ${relBadge(a.relevance)}${catBadges}
                </div>
                <div class="row g-2 mb-3" style="font-size:.88rem">
                    <div class="col-12"><i class="fas fa-file-alt text-primary me-1"></i><b>项目名称</b>：<span class="text-secondary">${esc(d.project_name || a.project_name || '-')}</span></div>
                    <div class="col-6 col-md-3"><i class="far fa-calendar text-secondary me-1"></i><b>发布日期</b>：<span class="text-secondary">${esc(d.publish_date || '-')}</span></div>
                    <div class="col-12 col-md-5"><i class="fas fa-building text-success me-1"></i><b>招标人</b>：${val(a.purchaser)}</div>
                    <div class="col-6 col-md-3"><i class="fas fa-file-signature text-primary me-1"></i><b>采购方式</b>：${val(a.method)}</div>
                    <div class="col-6 col-md-3"><i class="fas fa-yen-sign text-warning me-1"></i><b>预算金额</b>：${val(a.budget)}</div>
                    <div class="col-12 col-md-6"><i class="far fa-clock text-primary me-1"></i><b>投标截止</b>：${val(a.deadline)}</div>
                </div>
                ${a.qualification && a.qualification !== '未获取' ? `
                <div class="mb-3">
                    <div class="small fw-bold mb-1"><i class="fas fa-user-check text-info me-1"></i>资格要求</div>
                    <div class="qual-box">${esc(a.qualification)}</div>
                </div>` : ''}
                <div class="summary-text">${esc(a.summary || '（暂无 AI 摘要）')}</div>
                <div class="mt-2">
                    ${listHtml(a.risk, 'text-danger', '风险', 'fa-exclamation-triangle')}
                    ${listHtml(a.compliance, 'text-warning', '合规', 'fa-shield-alt')}
                    ${listHtml(a.scoring, 'text-primary', '评分', 'fa-balance-scale')}
                </div>
                <div class="mt-2">${kws}</div>
                <div class="meta-line mt-2">状态：${esc(d.status)} · 分析时间：${esc(d.analyzed_at || '-')} · 来源：${esc(d.region)} ${esc(d.project_source)}${src.content_source ? ' · ' + esc(src.content_source) : ''}</div>
                ${a.error ? `<div class="small text-danger mt-1">${esc(a.error)}</div>` : ''}`;
            $('dmDeepBox').innerHTML = a.deep
                ? renderDeep(a.deep)
                : (a.deep_error ? `<div class="small text-danger">深入分析失败：${esc(a.deep_error)}</div>` : '');
            $('dmContent').textContent = d.detail_content || '（无正文，点「开始 AI 分析」会自动抓取）';
            $('dmLink').href = d.detail_url || '#';
            $('dmLink').style.display = d.detail_url ? '' : 'none';
            new bootstrap.Modal($('detailModal')).show();
        } catch (e) {
            alert('加载详情失败：' + e.message);
        }
    }

    // ---------- 交互 ----------
    $('btnAnalyze').addEventListener('click', async () => {
        const perBatch = parseInt($('oLimit').value || 20, 10);
        const payload = {
            table: $('fTable').value,
            limit: perBatch,
            // 一轮轮跑到没候选为止，这里给总闸：默认 10 轮
            max_total: perBatch * 10,
            content_filter: 'has_content'
        };
        $('btnAnalyze').disabled = true;
        try {
            const res = await api('/ai-analysis/api/analyze', {
                method: 'POST', headers: headers(true), body: JSON.stringify(payload)
            });
            updateTask(res.task);
            if (!taskTimer) taskTimer = setInterval(pollTask, 2500);
        } catch (e) {
            alert('启动失败：' + e.message);
        } finally {
            setTimeout(() => { $('btnAnalyze').disabled = false; }, 1200);
        }
    });

    $('btnStop').addEventListener('click', async () => {
        $('btnStop').disabled = true;
        $('btnStop').textContent = '停止中…';
        try {
            const res = await api('/ai-analysis/api/stop', {
                method: 'POST', headers: headers(true)
            });
            updateTask(res.task);
        } catch (e) {
            alert('停止失败：' + e.message);
            $('btnStop').disabled = false;
            $('btnStop').textContent = '停止';
        }
    });

    $('btnRefresh').addEventListener('click', () => { loadStats(); loadList(1); });

    ['fTable', 'fStatus', 'fAnn', 'fCat'].forEach(id =>
        $(id).addEventListener('change', () => loadList(1)));
    ['fRel', 'fStart', 'fEnd'].forEach(id =>
        $(id).addEventListener('change', () => loadList(1)));
    let kwTimer = null;
    $('fKeyword').addEventListener('input', () => {
        clearTimeout(kwTimer);
        kwTimer = setTimeout(() => loadList(1), 400);
    });

    $('listContainer').addEventListener('click', e => {
        const row = e.target.closest('tr[data-table]');
        if (!row) return;
        openDetail(row.dataset.table, row.dataset.id);
    });

    $('paginationContainer').addEventListener('click', e => {
        const a = e.target.closest('a[data-page]');
        if (!a) return;
        e.preventDefault();
        const p = parseInt(a.dataset.page, 10);
        if (p >= 1) loadList(p);
    });

    $('dmReanalyze').addEventListener('click', async () => {
        if (!currentDetail) return;
        const btn = $('dmReanalyze');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>分析中…';
        try {
            await api(`/ai-analysis/api/analyze-one/${currentDetail.table}/${currentDetail.id}`, {
                method: 'POST', headers: headers(false)
            });
            bootstrap.Modal.getInstance($('detailModal')).hide();
            loadStats();
            loadList(currentPage);
        } catch (e) {
            alert('分析失败：' + e.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-magic me-1"></i>重新分析';
        }
    });

    // ---------- 深入分析 ----------
    $('dmDeep').addEventListener('click', async () => {
        if (!currentDetail) return;
        const btn = $('dmDeep');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>分析中…';
        try {
            const res = await api(`/ai-analysis/api/deep-analyze/${currentDetail.table}/${currentDetail.id}`, {
                method: 'POST', headers: headers(false)
            });
            $('dmDeepBox').innerHTML = renderDeep(res.data);
            loadList(currentPage);
        } catch (e) {
            alert('深入分析失败：' + e.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-user-check me-1"></i>深入分析（对比公司资质）';
        }
    });

    // ---------- 公司资质档案 ----------
    const COMPANY_ORDER = ['company_name', 'qualifications', 'certificates', 'performance', 'personnel', 'finance', 'advantages'];

    async function openCompany() {
        $('companyForm').innerHTML = '<div class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin"></i> 加载中…</div>';
        new bootstrap.Modal($('companyModal')).show();
        try {
            const res = await api('/ai-analysis/api/company-profile');
            const data = res.data || {}, labels = res.labels || {};
            $('companyForm').innerHTML = COMPANY_ORDER.map(k => {
                const label = labels[k] || k;
                const v = esc(data[k] || '');
                if (k === 'company_name') {
                    return `<div class="mb-2"><div class="form-label-sm">${esc(label)}</div>
                        <input class="form-control form-control-sm" id="cp_${k}" value="${v}"></div>`;
                }
                return `<div class="mb-2"><div class="form-label-sm">${esc(label)}</div>
                    <textarea class="form-control form-control-sm" id="cp_${k}" rows="2">${v}</textarea></div>`;
            }).join('');
        } catch (e) {
            $('companyForm').innerHTML = `<div class="text-danger small">加载失败：${esc(e.message)}</div>`;
        }
    }

    $('btnCompany').addEventListener('click', openCompany);

    $('btnSaveCompany').addEventListener('click', async () => {
        const payload = {};
        COMPANY_ORDER.forEach(k => {
            const el = $('cp_' + k);
            if (el) payload[k] = el.value;
        });
        const btn = $('btnSaveCompany');
        btn.disabled = true;
        try {
            await api('/ai-analysis/api/company-profile', {
                method: 'POST', headers: headers(true), body: JSON.stringify(payload)
            });
            alert('公司资质档案已保存');
            bootstrap.Modal.getInstance($('companyModal')).hide();
        } catch (e) {
            alert('保存失败：' + e.message);
        } finally {
            btn.disabled = false;
        }
    });

    // 初始化：日期默认近 7 天（含今天）
    (function initDates() {
        const fmt = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const end = new Date();
        const start = new Date();
        start.setDate(start.getDate() - 6);
        $('fEnd').value = fmt(end);
        $('fStart').value = fmt(start);
    })();
    loadStats();
    loadList(1);
    setInterval(loadStats, 30000);
})();
</script>
</body>
</html>
